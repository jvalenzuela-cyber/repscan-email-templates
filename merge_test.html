<!doctype html>
<html lang="es"><head><meta charset="utf-8"></head>
<body style="margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1a1d24;">
<div style="max-width:600px;margin:0 auto;padding:24px;">
  <h2 style="font-size:16px;">Test merge tag (rr_ciudad = "60")</h2>
  <p style="font-size:13px;color:#555;">El formato correcto mostrará <b>60</b> y una barra al <b>60%</b>. El otro saldrá con el tag literal o vacío.</p>

  <h3 style="font-size:14px;">1) TEXTO</h3>
  <p>F1 &nbsp; <code>$[rr_ciudad]$</code> &rarr; <b>$[rr_ciudad]$</b></p>
  <p>F3 &nbsp; <code>$[UD:rr_ciudad]$</code> &rarr; <b>$[UD:rr_ciudad]$</b></p>

  <h3 style="font-size:14px;margin-top:20px;">2) Dentro del width</h3>
  <p style="margin:12px 0 4px;">F1 (rr_ciudad)</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#e9edf1;border-radius:6px;"><tr>
    <td width="$[rr_ciudad]$%" height="14" bgcolor="#1C7BBE" style="height:14px;font-size:0;line-height:14px;border-radius:6px;">&nbsp;</td>
    <td height="14" style="font-size:0;line-height:14px;">&nbsp;</td></tr></table>

  <p style="margin:12px 0 4px;">F3 (UD:rr_ciudad)</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#e9edf1;border-radius:6px;"><tr>
    <td width="$[UD:rr_ciudad]$%" height="14" bgcolor="#b4451f" style="height:14px;font-size:0;line-height:14px;border-radius:6px;">&nbsp;</td>
    <td height="14" style="font-size:0;line-height:14px;">&nbsp;</td></tr></table>
</div></body></html>
